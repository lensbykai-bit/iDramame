services:
  - type: web
    name: idramaai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_STORAGE_CHAT_ID
        sync: false
      - key: BAKONG_ACCOUNT_ID
        sync: false
      - key: BAKONG_TOKEN
        sync: false
      - key: BAKONG_TEST_MODE
        value: "false"
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
