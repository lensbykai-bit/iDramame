services:
  - type: web
    name: idramaai
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildFilter:
      ignoredPaths:
        - public/uploads/covers/**
        - private-media/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BRAND_NAME
        value: iDrama.ai
      - key: PUBLIC_BASE_URL
        value: https://idramaai.onrender.com

      # Account-bound protected playback gateway
      - key: SECURE_INNER_PORT
        value: "3101"
      - key: STREAM_SESSION_TTL_MS
        value: "7200000"
      - key: MAX_STREAM_DEVICES
        value: "1"
      - key: MAX_STREAM_IPS
        value: "2"
      - key: MAX_CONCURRENT_STREAMS
        value: "3"
      - key: SUPABASE_URL
        value: https://kbanmyaqodtfoqikzwou.supabase.co
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_7iqItoUm3UU8Vn24VZvC7Q_0AoTUrzo
      - key: SUPABASE_CHECKOUT_FUNCTION
        value: https://kbanmyaqodtfoqikzwou.supabase.co/functions/v1/idrama-checkout

      # Telegram / private media storage.
      # Protected video automatically falls back to AES-256-GCM encrypted
      # GitHub media storage if Telegram is unavailable.
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: iDramaAi_bot
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_CHANNEL_URL
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: TELEGRAM_STORAGE_CHAT_ID
        sync: false

      # Bakong KHQR receiver
      - key: BAKONG_ACCOUNT_ID
        sync: false
      - key: BAKONG_MERCHANT_NAME
        value: iDrama.ai
      - key: BAKONG_STORE_LABEL
        value: iDrama.ai
      - key: BAKONG_MERCHANT_CITY
        value: PHNOM PENH
      - key: BAKONG_MOBILE_NUMBER
        sync: false

      # Bakong Open API token is kept server-side.
      - key: BAKONG_API_BASE_URL
        value: https://api-bakong.nbc.gov.kh
      - key: BAKONG_TOKEN
        sync: false
      - key: BAKONG_TEST_MODE
        value: "false"

      # Stable signing/encryption secrets
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: STREAM_SESSION_SECRET
        sync: false

      # Admin / GitHub persistence
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: lensbykai-bit/iDramame
      - key: GITHUB_BRANCH
        value: main
