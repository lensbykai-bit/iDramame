services:
  - type: web
    name: khnhom-chong-merl-rueng-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BRAND_NAME
        value: ខ្ញុំចង់មើលរឿងអេអាយ
      - key: BOT_TOKEN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://idramame.onrender.com
      - key: BAKONG_ACCOUNT_ID
        sync: false
      - key: BAKONG_MERCHANT_NAME
        value: AI STORY KH
      - key: BAKONG_STORE_LABEL
        value: AI STORY KH
      - key: BAKONG_MERCHANT_CITY
        value: PHNOM PENH
      - key: BAKONG_MOBILE_NUMBER
        sync: false
      - key: BAKONG_API_BASE_URL
        value: https://api-bakong.nbc.gov.kh
      - key: BAKONG_TOKEN
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: lensbykai-bit/iDramame
      - key: GITHUB_BRANCH
        value: main
