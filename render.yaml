services:
  - type: web
    name: idramaai
    runtime: node
    plan: free
    autoDeployTrigger: commit
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: BRAND_NAME
        value: iDrama.ai
      - key: PUBLIC_BASE_URL
        value: https://idramaai.onrender.com

      # Telegram / private media storage
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: iDramaAi_bot
      - key: TELEGRAM_CHANNEL_ID
        sync: false
      - key: TELEGRAM_CHANNEL_URL
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: TELEGRAM_STORAGE_CHAT_ID
        sync: false

      # Bakong KHQR receiver
      - key: BAKONG_ACCOUNT_ID
        sync: false
      - key: BAKONG_MERCHANT_NAME
        value: iDrama.ai
      - key: BAKONG_STORE_LABEL
        value: iDrama.ai
      - key: BAKONG_MERCHANT_CITY
        value: PHNOM PENH
      - key: BAKONG_MOBILE_NUMBER
        sync: false

      # Bakong Open API token is kept server-side.
      - key: BAKONG_API_BASE_URL
        value: https://api-bakong.nbc.gov.kh
      - key: BAKONG_TOKEN
        sync: false
      - key: BAKONG_TEST_MODE
        value: "false"

      # Stable signing secret for checkout/watch access
      - key: ACCESS_TOKEN_SECRET
        sync: false

      # Admin / GitHub persistence
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: lensbykai-bit/iDramame
      - key: GITHUB_BRANCH
        value: main
