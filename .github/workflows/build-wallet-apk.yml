name: Build iDrama Pay APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'wallet-android/**'
      - 'public/wallet.html'
      - 'public/wallet.js'
      - '.github/workflows/build-wallet-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        working-directory: wallet-android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp wallet-android/app/build/outputs/apk/debug/app-debug.apk iDrama-Pay-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: iDrama-Pay-APK
          path: iDrama-Pay-v1.0.apk
          if-no-files-found: error
          retention-days: 30
